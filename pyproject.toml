[project]
name = "subtribe-ats"
version = "1.0.0"
description = "Multi-tenant Applicant Tracking System"
requires-python = ">=3.10"

# ============================================================================
# RUFF - Fast Python Linter & Formatter
# ============================================================================
[tool.ruff]
# Line length (standard is 88, we use 100 for readability)
line-length = 100
target-version = "py310"

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    "database/migrations/versions",  # Don't lint auto-generated migrations
]

[tool.ruff.lint]
# Enable these rule categories:
# E = pycodestyle errors
# F = Pyflakes (undefined names, unused imports)
# W = pycodestyle warnings
# I = isort (import sorting)
# N = pep8-naming
# UP = pyupgrade (modern Python syntax)
# B = flake8-bugbear (common bugs)
# C4 = flake8-comprehensions
# SIM = flake8-simplify
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

# Ignore specific rules:
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults (FastAPI uses this pattern)
    "N818",  # Exception name should end with Error (AppException is intentional)
    "E402",  # Module level import not at top (intentional for Alembic migrations)
    "SIM105", # Use contextlib.suppress - try-except-pass is clearer for cleanup
]

# Allow autofix for these rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Test files can have longer lines, unused imports
"tests/**/*.py" = ["E501", "F401", "F811"]
# __init__.py files often have unused imports (re-exports)
"__init__.py" = ["F401"]
# Schema files can use camelCase to match frontend API expectations
"app/schemas/*.py" = ["N815"]

[tool.ruff.format]
# Use single quotes instead of double quotes
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect magic trailing comma
skip-magic-trailing-comma = false

# ============================================================================
# PYTEST - Testing Framework
# ============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Exclude integration, performance, and e2e tests by default
norecursedirs = ["tests/integration", "tests/performance", "tests/e2e"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",  # Show summary of all test outcomes
    "--strict-markers",  # Raise error on unknown markers
    "--strict-config",  # Raise error on config issues
    "-v",  # Verbose output
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require database)",
    "e2e: End-to-end tests (require running server)",
    "performance: Performance tests",
]

# ============================================================================
# MYPY - Static Type Checker
# ============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for strict typing (later)
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "google.cloud.*",
    "sqlalchemy.*",
    "alembic.*",
    "jose.*",
]
ignore_missing_imports = true

# ============================================================================
# COVERAGE - Code Coverage (Optional - for later)
# ============================================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
]

