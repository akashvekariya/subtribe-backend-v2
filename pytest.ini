[pytest]
# Pytest configuration for async tests
asyncio_mode = auto

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbose output
addopts = 
    -ra
    --strict-markers
    --strict-config

# Markers
markers =
    e2e: End-to-end tests
    performance: Performance tests
    unit: Unit tests
    integration: Integration tests

# Ignore paths
testpaths = tests
norecursedirs = tests/integration tests/performance tests/e2e

# Note: Integration, Performance, and E2E tests are disabled for production.
# They require a running server and specific environment setup.
# To run them explicitly:
#   pytest tests/integration/ -v
#   pytest tests/performance/ -v
#   pytest tests/e2e/ -v

