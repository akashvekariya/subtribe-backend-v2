name: CI/CD Pipeline

# Trigger on all pull requests and pushes to any branch
# Deployment is controlled by job-level conditions (only main deploys)
on:
  push:  # All pushes trigger lint-test, only main deploys
  workflow_dispatch:  # Allow manual triggering

# Required for auto-versioning (create tags and releases)
permissions:
  contents: write

env:
  # GCP Configuration
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-south1  # Mumbai region
  # OLD: SERVICE_NAME: subtribe-ats-api-dev
  # REASON: SERVICE_NAME is now dynamic (determined per-deployment in the job)
  # - Main branch → subtribe-ats-api-prod (production)
  # - Feature branches with "push-" commits → subtribe-ats-api-dev (development)
  # Value is set in steps.deployment_target.outputs.service_name
  IMAGE_NAME: subtribe-ats-backend

jobs:
  # ============================================================================
  # Job 1: Lint & Test (runs on all pushes/PRs)
  # ============================================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Ruff linter (check for errors)
      - name: Lint with Ruff
        run: |
          echo "🔍 Running Ruff linter..."
          ruff check . --output-format=github
        continue-on-error: false

      # Step 5: Run Ruff formatter check (ensure code is formatted)
      - name: Check code formatting
        run: |
          echo "✨ Checking code formatting with Ruff..."
          ruff format --check .
        continue-on-error: false

      # Step 6: Run mypy type checking
      - name: Type check with mypy
        run: |
          echo "🔎 Running mypy type checker..."
          mypy app --ignore-missing-imports --check-untyped-defs
        continue-on-error: true  # Don't fail build on type errors (warning only)

      # Step 7: Run unit tests (schemas & services only - no DB needed)
      - name: Run unit tests
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          JWT_SECRET_KEY: "test-secret-key-for-ci"
          JWT_ALGORITHM: "HS256"
          JWT_EXPIRY_DAYS: "15"
          REFRESH_TOKEN_EXPIRY_DAYS: "30"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_KEY: "test-service-key"
          SUPABASE_JWT_SECRET: "test-jwt-secret"
          GCS_BUCKET_NAME: "test-bucket"
          GCS_PROJECT_ID: "test-project"
          GOOGLE_APPLICATION_CREDENTIALS: "/tmp/fake-credentials.json"
          CORS_ORIGINS: '["http://localhost:3000"]'
          ENVIRONMENT: "testing"
        run: |
          echo "🧪 Running unit tests..."
          # Create fake GCS credentials file (tests use mocks)
          mkdir -p /tmp
          echo '{"type": "service_account"}' > /tmp/fake-credentials.json
          # Run ONLY pure unit tests (schemas & services - no database needed)
          pytest tests/unit/test_schemas.py tests/unit/test_services.py -v --tb=short
        continue-on-error: false

      # Step 8: Summary
      - name: Summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "   - Code linting ✓"
          echo "   - Code formatting ✓"
          echo "   - Type checking ✓"
          echo "   - Unit tests (schemas & services) ✓"
          echo ""
          echo "Note: Database-dependent tests (test_models.py) run locally only."

  # ============================================================================
  # Job 2: Deploy (runs ONLY on push to main, after lint-test succeeds)
  # ============================================================================
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: lint-test  # Wait for lint-test to pass
    # OLD: if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    # REASON: Now supports deployment from any branch (if commit starts with "push-") OR main branch
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.event.head_commit.message, 'push-')))
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for versioning

      # Step 2: Detect deployment target (development vs production)
      # REASON: Support branch-based deployment
      # - Main branch → PRODUCTION (subtribe-ats-api-prod)
      # - Any branch with commit starting with "push-" → DEVELOPMENT (subtribe-ats-api-dev)
      - name: Detect deployment target
        id: deployment_target
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "📝 Branch: $BRANCH_NAME"
          echo "📝 Commit message: $COMMIT_MSG"

          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "🚀 PRODUCTION deployment (main branch)"
            echo "target_env=production" >> $GITHUB_OUTPUT
            echo "service_name=subtribe-ats-api-prod" >> $GITHUB_OUTPUT
            echo "env_name=production" >> $GITHUB_OUTPUT
          else
            echo "🔧 DEVELOPMENT deployment (feature branch with 'push-' prefix)"
            echo "target_env=development" >> $GITHUB_OUTPUT
            echo "service_name=subtribe-ats-api-dev" >> $GITHUB_OUTPUT
            echo "env_name=development" >> $GITHUB_OUTPUT
          fi

          echo "Environment: ${{ steps.deployment_target.outputs.env_name }}"
          echo "Service: ${{ steps.deployment_target.outputs.service_name }}"

      # Step 3: Bump version and create tag (PRODUCTION ONLY)
      # REASON: Only create semantic versions for production deployments (main branch)
      # Dev deployments use commit SHA instead to avoid version collisions
      - name: Bump version and push tag
        id: tag_version
        if: github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch  # Default to patch if no conventional commit
          release_branches: main
          tag_prefix: v

      # Step 4: Create GitHub Release (PRODUCTION ONLY)
      # REASON: Only create releases for production versions
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

      # Step 4: Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 5: Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 6: Configure Docker to use gcloud as credential helper
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # Step 7: Build Docker image with version tags
      # REASON: Use dynamic service_name and version (semantic for prod, SHA for dev)
      - name: Build Docker image
        run: |
          VERSION_TAG="${{ steps.tag_version.outputs.new_tag || github.sha }}"
          echo "🔨 Building Docker image version $VERSION_TAG..."
          echo "🎯 Target: ${{ steps.deployment_target.outputs.service_name }}"
          docker build \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ steps.deployment_target.outputs.service_name }}:$VERSION_TAG \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ steps.deployment_target.outputs.service_name }}:latest \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ steps.deployment_target.outputs.service_name }}:${{ github.sha }} \
            .

      # Step 8: Push Docker image to Artifact Registry
      # REASON: Use dynamic service_name and version
      - name: Push Docker image
        run: |
          VERSION_TAG="${{ steps.tag_version.outputs.new_tag || github.sha }}"
          echo "📦 Pushing Docker image with version $VERSION_TAG to Artifact Registry..."
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ steps.deployment_target.outputs.service_name }}:$VERSION_TAG
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ steps.deployment_target.outputs.service_name }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ steps.deployment_target.outputs.service_name }}:${{ github.sha }}

      # Step 9: Deploy to Cloud Run
      # REASON: Use dynamic service_name, env_name, and version
      # OLD: Always deployed to subtribe-ats-api-dev with ENVIRONMENT=development
      # NEW: Deploys to dev or prod based on branch
      - name: Deploy to Cloud Run
        run: |
          VERSION_TAG="${{ steps.tag_version.outputs.new_tag || github.sha }}"
          echo "🚀 Deploying version $VERSION_TAG to Cloud Run..."
          echo "🎯 Service: ${{ steps.deployment_target.outputs.service_name }}"
          echo "🌍 Environment: ${{ steps.deployment_target.outputs.env_name }}"
          gcloud run deploy ${{ steps.deployment_target.outputs.service_name }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ steps.deployment_target.outputs.service_name }}:$VERSION_TAG \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="ENVIRONMENT=${{ steps.deployment_target.outputs.env_name }},DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }},JWT_ALGORITHM=HS256,JWT_EXPIRY_DAYS=15,REFRESH_TOKEN_EXPIRY_DAYS=30,SUPABASE_URL=${{ vars.SUPABASE_URL }},SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }},SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }},SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }},GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }},GCS_PROJECT_ID=${{ vars.GCS_PROJECT_ID }},CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}" \
            --service-account=subtribe-ats-storage@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60s \
            --max-instances=2 \
            --min-instances=0

      # Step 10: Get service URL
      # REASON: Use dynamic service_name and version
      - name: Get service URL
        run: |
          VERSION_TAG="${{ steps.tag_version.outputs.new_tag || github.sha }}"
          SERVICE_URL=$(gcloud run services describe ${{ steps.deployment_target.outputs.service_name }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Deployment successful!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "🎯 Service: ${{ steps.deployment_target.outputs.service_name }}"
          echo "🌍 Environment: ${{ steps.deployment_target.outputs.env_name }}"
          echo "📦 Version: $VERSION_TAG"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      # Step 11: Run smoke test
      # REASON: Use dynamic service_name from deployment_target step
      - name: Smoke test
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ steps.deployment_target.outputs.service_name }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "🔍 Running smoke test..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/health)
          if [ $HTTP_CODE -eq 200 ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
          else
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

