name: CI/CD Pipeline

# Trigger on all pull requests and pushes to any branch
# Deployment is controlled by job-level conditions (only main deploys)
on:
  push:  # All pushes trigger lint-test, only main deploys
  workflow_dispatch:  # Allow manual triggering

# Required for auto-versioning (create tags and releases)
permissions:
  contents: write

env:
  # GCP Configuration
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-south1  # Mumbai region
  SERVICE_NAME: subtribe-ats-api
  IMAGE_NAME: subtribe-ats-backend

jobs:
  # ============================================================================
  # Job 1: Lint & Test (runs on all pushes/PRs)
  # ============================================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Ruff linter (check for errors)
      - name: Lint with Ruff
        run: |
          echo "🔍 Running Ruff linter..."
          ruff check . --output-format=github
        continue-on-error: false

      # Step 5: Run Ruff formatter check (ensure code is formatted)
      - name: Check code formatting
        run: |
          echo "✨ Checking code formatting with Ruff..."
          ruff format --check .
        continue-on-error: false

      # Step 6: Run mypy type checking
      - name: Type check with mypy
        run: |
          echo "🔎 Running mypy type checker..."
          mypy app --ignore-missing-imports --check-untyped-defs
        continue-on-error: true  # Don't fail build on type errors (warning only)

      # Step 7: Run unit tests (schemas & services only - no DB needed)
      - name: Run unit tests
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          JWT_SECRET_KEY: "test-secret-key-for-ci"
          JWT_ALGORITHM: "HS256"
          JWT_EXPIRY_DAYS: "15"
          REFRESH_TOKEN_EXPIRY_DAYS: "30"
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_ANON_KEY: "test-anon-key"
          SUPABASE_SERVICE_KEY: "test-service-key"
          SUPABASE_JWT_SECRET: "test-jwt-secret"
          GCS_BUCKET_NAME: "test-bucket"
          GCS_PROJECT_ID: "test-project"
          GOOGLE_APPLICATION_CREDENTIALS: "/tmp/fake-credentials.json"
          CORS_ORIGINS: '["http://localhost:3000"]'
          ENVIRONMENT: "testing"
        run: |
          echo "🧪 Running unit tests..."
          # Create fake GCS credentials file (tests use mocks)
          mkdir -p /tmp
          echo '{"type": "service_account"}' > /tmp/fake-credentials.json
          # Run ONLY pure unit tests (schemas & services - no database needed)
          pytest tests/unit/test_schemas.py tests/unit/test_services.py -v --tb=short
        continue-on-error: false

      # Step 8: Summary
      - name: Summary
        if: success()
        run: |
          echo "✅ All checks passed!"
          echo "   - Code linting ✓"
          echo "   - Code formatting ✓"
          echo "   - Type checking ✓"
          echo "   - Unit tests (schemas & services) ✓"
          echo ""
          echo "Note: Database-dependent tests (test_models.py) run locally only."

  # ============================================================================
  # Job 2: Deploy (runs ONLY on push to main, after lint-test succeeds)
  # ============================================================================
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: lint-test  # Wait for lint-test to pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only deploy on push to main
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for versioning

      # Step 2: Bump version and create tag
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch  # Default to patch if no conventional commit
          release_branches: main
          tag_prefix: v

      # Step 3: Create GitHub Release
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

      # Step 4: Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 5: Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 6: Configure Docker to use gcloud as credential helper
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # Step 7: Build Docker image with version tags
      - name: Build Docker image
        run: |
          echo "🔨 Building Docker image version ${{ steps.tag_version.outputs.new_tag }}..."
          docker build \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ steps.tag_version.outputs.new_tag }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .

      # Step 8: Push Docker image to Artifact Registry
      - name: Push Docker image
        run: |
          echo "📦 Pushing Docker image with version ${{ steps.tag_version.outputs.new_tag }} to Artifact Registry..."
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ steps.tag_version.outputs.new_tag }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # Step 9: Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying version ${{ steps.tag_version.outputs.new_tag }} to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ steps.tag_version.outputs.new_tag }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="ENVIRONMENT=production" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
            --set-env-vars="JWT_ALGORITHM=HS256" \
            --set-env-vars="JWT_EXPIRY_DAYS=15" \
            --set-env-vars="REFRESH_TOKEN_EXPIRY_DAYS=30" \
            --set-env-vars="SUPABASE_URL=${{ vars.SUPABASE_URL }}" \
            --set-env-vars="SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}" \
            --set-env-vars="SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" \
            --set-env-vars="SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}" \
            --set-env-vars="GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}" \
            --set-env-vars="GCS_PROJECT_ID=${{ vars.GCS_PROJECT_ID }}" \
            --set-env-vars="CORS_ORIGINS='${{ vars.CORS_ORIGINS }}'" \
            --service-account=github-actions@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60s \
            --max-instances=2 \
            --min-instances=0

      # Step 10: Get service URL
      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Deployment successful!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "📦 Version: ${{ steps.tag_version.outputs.new_tag }}"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      # Step 11: Run smoke test
      - name: Smoke test
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "🔍 Running smoke test..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/health)
          if [ $HTTP_CODE -eq 200 ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
          else
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

