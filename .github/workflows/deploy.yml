name: CD - Deploy to Cloud Run

# Trigger deployment when code is pushed to main branch (after CI passes)
on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering from GitHub Actions UI

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}  # Using variable (non-sensitive)
  REGION: asia-south1  # Mumbai region
  SERVICE_NAME: subtribe-ats-api
  IMAGE_NAME: subtribe-ats-backend

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    
    # Require CI to pass before deploying
    needs: []  # Add CI job as dependency if you want
    
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for versioning

      # Step 2: Bump version and create tag
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch  # Default to patch if no conventional commit
          release_branches: main
          tag_prefix: v

      # Step 3: Create GitHub Release
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

      # Step 4: Authenticate with Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 5: Set up Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Step 6: Configure Docker to use gcloud as credential helper
      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # Step 7: Build Docker image with version tags
      - name: Build Docker image
        run: |
          echo "🔨 Building Docker image version ${{ steps.tag_version.outputs.new_tag }}..."
          docker build \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ steps.tag_version.outputs.new_tag }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            .

      # Step 8: Push Docker image to Artifact Registry
      - name: Push Docker image
        run: |
          echo "📦 Pushing Docker image with version ${{ steps.tag_version.outputs.new_tag }} to Artifact Registry..."
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ steps.tag_version.outputs.new_tag }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:latest
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      # Step 9: Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying version ${{ steps.tag_version.outputs.new_tag }} to Cloud Run..."
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.SERVICE_NAME }}:${{ steps.tag_version.outputs.new_tag }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="ENVIRONMENT=production" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
            --set-env-vars="JWT_ALGORITHM=HS256" \
            --set-env-vars="JWT_EXPIRY_DAYS=15" \
            --set-env-vars="REFRESH_TOKEN_EXPIRY_DAYS=30" \
            --set-env-vars="SUPABASE_URL=${{ vars.SUPABASE_URL }}" \
            --set-env-vars="SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}" \
            --set-env-vars="SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" \
            --set-env-vars="SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}" \
            --set-env-vars="GCS_BUCKET_NAME=${{ vars.GCS_BUCKET_NAME }}" \
            --set-env-vars="GCS_PROJECT_ID=${{ vars.GCS_PROJECT_ID }}" \
            --set-env-vars="CORS_ORIGINS=${{ vars.CORS_ORIGINS }}" \
            --service-account=github-actions@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --memory=512Mi \
            --cpu=1 \
            --timeout=60s \
            --max-instances=2 \
            --min-instances=0

      # Step 10: Get service URL
      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "✅ Deployment successful!"
          echo "🌐 Service URL: $SERVICE_URL"
          echo "📦 Version: ${{ steps.tag_version.outputs.new_tag }}"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      # Step 11: Run smoke test
      - name: Smoke test
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "🔍 Running smoke test..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/health)
          if [ $HTTP_CODE -eq 200 ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
          else
            echo "❌ Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi

